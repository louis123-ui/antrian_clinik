[package]
name = "antrian-clinik"
version = "1.0.0"
edition = "2021"

[lib]
name = "antrian_clinik_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }

[build-dependencies]
tauri-build = { version = "2", features = [] }
